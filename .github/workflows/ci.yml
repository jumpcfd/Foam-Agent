name: CI

on:
  push:
  pull_request:

# Note: none of these jobs fetch Git LFS content, provide credentials, or install a
# harness CLI. The unit tests must depend on none of the three, and this is how we keep
# that true.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --no-install-project
      - run: uv run --no-sync ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      # No credentials are provided on purpose: importing the package or collecting the
      # tests must never require them.
      - run: uv run --no-sync pytest -m "not integration" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv build
      # Install the built wheel into a clean environment: catches packaging mistakes that
      # an editable install hides, such as a module left out of the wheel.
      - run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          # An installed wheel has no repository around it, so FOAMAGENT_ROOT is how the
          # data directory gets located. Assert that path rather than the (meaningless)
          # value repo_root() infers from site-packages.
          FOAMAGENT_ROOT=/tmp/somewhere /tmp/wheel-check/bin/python -c "
          import foamagent
          from foamagent import paths
          from foamagent.harness import skill_source
          assert paths.repo_root().as_posix() == '/tmp/somewhere', paths.repo_root()
          # foamagent install copies this out of the package, so a wheel without it
          # configures a harness that has no idea how to drive the tools.
          assert (skill_source() / 'SKILL.md').is_file(), skill_source()
          # The review prompts are data files too: without them every review fails at
          # the point where it would have been most useful.
          from foamagent.review.templates import TEMPLATES, packaged_dir
          for name in TEMPLATES:
              assert (packaged_dir() / name).is_file(), name
          print('wheel ok')
          "
