[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foamagent"
version = "2.0.0"
description = "Multi-agent framework that automates CFD simulations in OpenFOAM using natural language prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Foam-Agent Team"},
]
keywords = ["openfoam", "cfd", "mcp", "llm", "agent", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Core: what the package needs to be imported and to serve its tools. No model runtime is
# among them -- this process runs no model. The renderer lives in an extra, so that
# `pip install foamagent` stays small for a user who never renders anything.
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["pyvista>=0.44"]
all = ["foamagent[viz]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
foamagent = "foamagent.cli:main"
foamagent-mcp = "foamagent.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/csml-rpi/Foam-Agent"
Repository = "https://github.com/csml-rpi/Foam-Agent"
Issues = "https://github.com/csml-rpi/Foam-Agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foamagent", "foamagent.*"]

[tool.setuptools.package-data]
"foamagent" = ["*.txt"]
# The skill is shipped, not generated: `foamagent install` copies it out of the package.
"foamagent.harness" = ["skill/*.md", "skill/**/*.md"]
# The audit prompts are shipped as editable Markdown; a same-named file under
# ~/.config/foamagent/templates/ wins over these.
"foamagent.review" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need a real OpenFOAM installation or Docker",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
# Deliberately narrow: catch real errors and keep stdout clean for the MCP stdio
# transport. Formatting is not enforced, to keep diffs reviewable.
select = ["E9", "F63", "F7", "F82", "T201"]

[tool.ruff.lint.per-file-ignores]
# The benchmark and validation scripts report to a person on stdout. The stdout ban exists
# to protect the MCP stdio channel, which none of these ever speak.
"src/foamagent/validation/**" = ["T201"]
"src/foamagent/bench/**" = ["T201"]
